---
name: Lint

on:
  pull_request:
    branches: [master]

env:
  GOTOOLCHAIN: local

jobs:
  golangci:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # ratchet:actions/checkout@v4
      - name: Setup Go environment
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # ratchet:actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: Golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # ratchet:golangci/golangci-lint-action@v8
        with:
          # An older golangci-lint can fail to type-check code built with a
          # newer Go. If bumping .go-version breaks lint, bump this too.
          version: v2.15.0
          install-mode: goinstall
          only-new-issues: true
